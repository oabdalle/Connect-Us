 # Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP .NET Core service.
version: "3.9"
services:
    reverseproxy:
        build:
            context: ./ConnectUs/docker/nginx
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:80:80"
        depends_on:
            - app
    app:
        build:
            context: .
            dockerfile: ./ConnectUs/docker/app/dev.Dockerfile
        ports:
            - "127.0.0.1:4000:4000"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
            Stripe__SecretKey: ${STRIPE_SECRET_KEY}
            Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
        depends_on:
            - db
        volumes:
            - .:/app
    db:
        image: "mcr.microsoft.com/azure-sql-edge"
        environment:
            MSSQL_SA_PASSWORD: ${DB_PASSWORD}
            ACCEPT_EULA: Y
        ports:
            - "127.0.0.1:1433:1433"
        volumes:
            - mysqldata:/var/opt/mssql
    node:
        build:
            context: .
            dockerfile: ./ConnectUs/docker/node/Dockerfile
        volumes:
            - node_modules:/src/ConnectUs/node_modules
            - ./ConnectUs/wwwroot:/src/ConnectUs/wwwroot
volumes:
  node_modules:
    driver: "local"
  mysqldata:
    driver: "local"
